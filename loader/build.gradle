import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'java-library'
    id 'maven-publish'
}

group = providers.gradleProperty('group').get()
version = providers.gradleProperty('version').get()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.carm.cc/repository/maven-public/'}
}

configurations {
    decompiler
    lwjglNatives
}

dependencies {
    implementation 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
    implementation 'io.github.llamalad7:mixinextras-common:0.5.5'
    implementation 'org.apache.logging.log4j:log4j-api:2.17.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.17.1'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'net.minecraft:launchwrapper:1.12'
    implementation 'com.google.guava:guava:33.7.1-jre'
    implementation 'org.ow2.asm:asm:9.10.1'
    implementation 'org.ow2.asm:asm-tree:9.10.1'
    implementation 'org.ow2.asm:asm-commons:9.10.1'
    implementation 'org.lwjgl.lwjgl:lwjgl:2.9.3'
    implementation 'org.lwjgl.lwjgl:lwjgl_util:2.9.3'
    decompiler 'org.vineflower:vineflower:1.10.1'
    lwjglNatives 'org.lwjgl.lwjgl:lwjgl-platform:2.9.3:natives-windows'
    lwjglNatives 'org.lwjgl.lwjgl:lwjgl-platform:2.9.3:natives-linux'
    lwjglNatives 'org.lwjgl.lwjgl:lwjgl-platform:2.9.3:natives-osx'
}

static def getOs() {
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        return 'win'
    }
    if (Os.isFamily(Os.FAMILY_MAC)) {
        return 'osx'
    }
    if (Os.isFamily(Os.FAMILY_UNIX))
        return 'linux' //this is not really all that correct
    throw new GradleException('Your OS does not seem to be supported')
}

def clients = [
        rd132211 : file('clients/rd-132211.jar'),
        rd132328 : file('clients/rd-132328.jar'),
        rd20090515: file('clients/rd-20090515.jar'),
        rd160052  : file('clients/rd-160052.jar'),
        rd161348  : file('clients/rd-161348.jar')
]

tasks.register('extractLwjglNatives', Sync) {
    def os = getOs()

    from configurations.lwjglNatives.collect { zipTree(it) }
    into layout.buildDirectory.dir("natives/$os")

    include '*.dll'
    include '*.so'
    include '*.dylib'
}

tasks.register("copyMod", Copy) {
    dependsOn project(":examplemod").tasks.named("build")

    outputs.upToDateWhen { false }

    from project(":examplemod").tasks.named("jar").get().archiveFile
    into layout.projectDirectory.dir("mods")
}

clients.each { clientName, minecraftJar ->
    def sourceSet = sourceSets.create(clientName)

    def decompiledDir = layout.buildDirectory.dir(
            "generated/${clientName}/minecraft-source"
    )

    def decompileTask = tasks.register(
            "decompile${clientName.capitalize()}",
            JavaExec
    ) {
        group = 'minecraft'
        description = "Decompiles ${minecraftJar.name}"

        classpath = configurations.decompiler

        mainClass = 'org.jetbrains.java.decompiler.main.decompiler.ConsoleDecompiler'

        inputs.file(minecraftJar)
        outputs.dir(decompiledDir)

        doFirst {
            if (!minecraftJar.isFile()) {
                throw new GradleException(
                        "Minecraft JAR does not exist: ${minecraftJar}"
                )
            }

            decompiledDir.get().asFile.mkdirs()
        }

        args(
                '-dgs=1',
                minecraftJar.absolutePath,
                decompiledDir.get().asFile.absolutePath
        )
    }

    sourceSet.java.srcDir(decompiledDir)

    configurations.named("${clientName}Implementation") {
        extendsFrom(configurations.implementation)
    }

    configurations.named("${clientName}CompileOnly") {
        extendsFrom(configurations.compileOnly)
    }

    configurations.named("${clientName}RuntimeOnly") {
        extendsFrom(configurations.runtimeOnly)
    }

    tasks.named(sourceSet.compileJavaTaskName) {
        dependsOn(decompileTask)
    }

    tasks.register("${clientName}Jar", Jar) {
        group = 'build'
        description = "Builds ${clientName}.jar"

        dependsOn(sourceSet.classesTaskName)

        archiveFileName = "${clientName}.jar"

        from(sourceSet.output)

        from(sourceSets.main.output)

        from(sourceSets.main.resources)

        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
}


tasks.register('buildClients') {
    group = 'build'
    description = 'Builds all Minecraft clients'

    dependsOn tasks.named('build')
    dependsOn clients.keySet().collect { "${it}Jar" }
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.main.output

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.named('javadoc') {
    source = fileTree('src/main/java')
}

tasks.register('runMinecraft', JavaExec) {
    def clientName = providers.gradleProperty('client').orNull

    if (clientName == null || !clients.containsKey(clientName)) {
        throw new GradleException(
                "missing or invalid -Pclient. clients: ${clients.keySet().join(', ')}"
        )
    }

    dependsOn tasks.named('extractLwjglNatives')

    dependsOn tasks.named("${clientName}Jar")

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }

    mainClass = 'net.minecraft.launchwrapper.Launch'

    classpath = files(
            clients[clientName],
            tasks.named("${clientName}Jar").get().archiveFile,
            configurations.runtimeClasspath
    )

    args '--tweakClass',
            'net.ancientloader.launch.AncientLoaderTweaker'

    systemProperty 'java.library.path',
            file("build/natives/${getOs()}").absolutePath
}
