import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'java-library'
}
apply from: '../libraries.gradle'

group = providers.gradleProperty('group').get()
version = providers.gradleProperty('version').get()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

configurations {
    decompiler
    lwjglNatives
}

dependencies {
    implementation 'org.ow2.asm:asm:9.10.1'
    implementation 'org.ow2.asm:asm-tree:9.10.1'
    implementation 'org.ow2.asm:asm-commons:9.10.1'
    implementation 'org.lwjgl.lwjgl:lwjgl:2.9.3'
    implementation 'org.lwjgl.lwjgl:lwjgl_util:2.9.3'
    decompiler 'org.vineflower:vineflower:1.10.1'
    lwjglNatives 'org.lwjgl.lwjgl:lwjgl-platform:2.9.3:natives-windows'
    lwjglNatives 'org.lwjgl.lwjgl:lwjgl-platform:2.9.3:natives-linux'
    lwjglNatives 'org.lwjgl.lwjgl:lwjgl-platform:2.9.3:natives-osx'
}

def getOs() {
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        return 'win'
    }
    if (Os.isFamily(Os.FAMILY_MAC)) {
        return 'osx'
    }
    if (Os.isFamily(Os.FAMILY_UNIX))
        return 'linux' //this is not really all that correct
    throw new GradleException('Your OS does not seem to be supported')
}

def minecraftJar = providers.gradleProperty('minecraftJar')
        .map { file(it) }
        .orElse(layout.projectDirectory.file('build/client.jar').asFile)
def decompiledDir = layout.buildDirectory.dir('generated/minecraft-source')
def patchedJar = layout.buildDirectory.file('libs/minecraft-ancientloader.jar')
def modJar = providers.gradleProperty('modJar')
    .orElse(tasks.jar.getArchiveFile().get().asFile)
def combinedJar = layout.buildDirectory.file(
        'libs/minecraft-ancientloader-combined.jar'
)

sourceSets {
    main {
        java {
            srcDir(decompiledDir)
        }
    }
}

tasks.register('extractLwjglNatives', Sync) {
    def os = getOs()

    from configurations.lwjglNatives.collect { zipTree(it) }
    into layout.buildDirectory.dir("natives/$os")

    include '*.dll'
    include '*.so'
    include '*.dylib'
}

tasks.register("copyMod", Copy) {
    dependsOn project(":examplemod").tasks.named("build")

    outputs.upToDateWhen { false }

    from file(project(":examplemod").tasks.named("jar").get().archiveFile)
    into layout.projectDirectory.dir("mods")
}


tasks.register('decompileMinecraft', JavaExec) {
    group = 'minecraft'
    description = 'decompiles the client jar'
    classpath = configurations.decompiler
    mainClass = 'org.jetbrains.java.decompiler.main.decompiler.ConsoleDecompiler'
    inputs.file(minecraftJar)
    outputs.dir(decompiledDir)
    doFirst {
        if (!minecraftJar.get().isFile()) {
            throw new GradleException('set -PminecraftJar=/path/to/client.jar')
        }
        decompiledDir.get().asFile.mkdirs()
    }
    args '-dgs=1', minecraftJar.get().absolutePath, decompiledDir.get().asFile.absolutePath
}
tasks.named("compileJava").configure { dependsOn(":loader:decompileMinecraft") }
tasks.named("sourcesJar").configure { dependsOn(":loader:decompileMinecraft") }

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn tasks.named("decompileMinecraft")

    from {
        configurations.runtimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }

    exclude 'META-INF/**'
}


tasks.register('patchMinecraft', JavaExec) {
    group = 'minecraft'
    description = 'injects AncientLoaderBootstrap into RubyDung.init and bundles loader classes.'
    dependsOn tasks.named('jar')
    dependsOn tasks.named('extractLwjglNatives')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.ancientloader.bootstrap.MinecraftPatcher'
    systemProperty 'java.library.path', file("build/natives/${getOs()}")
    inputs.file(minecraftJar)
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    outputs.file(patchedJar)
    doFirst {
        if (!minecraftJar.get().isFile()) {
            throw new GradleException('set -PminecraftJar=/path/to/client.jar')
        }
        patchedJar.get().asFile.parentFile.mkdirs()
    }
    args minecraftJar.get().absolutePath, tasks.named('jar').get().archiveFile.get().asFile.absolutePath, patchedJar.get().asFile.absolutePath
}

tasks.register('runMinecraft', JavaExec) {
    dependsOn tasks.named('patchMinecraft')
    dependsOn tasks.named('copyMod')

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }

    mainClass = 'com.mojang.rubydung.RubyDung'

    classpath = files(
            patchedJar,
            configurations.runtimeClasspath
    )

    systemProperty 'java.library.path',
            file("build/natives/${getOs()}").absolutePath
}


tasks.named('build') {
    dependsOn tasks.named('patchMinecraft')
}

tasks.register('cleanMinecraft', Delete) {
    delete layout.buildDirectory.dir('generated'), layout.buildDirectory.file('libs/minecraft-ancientloader.jar')
}

